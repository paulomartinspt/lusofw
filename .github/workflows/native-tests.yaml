name: Native LusoFW tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - native_lusofw
          - native_lusofw_pa
          - native_lusofw_cap10
          - native_identity_store
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Run native test suite
        run: pio test --environment ${{ matrix.environment }}
