name: ESP32 OTA compile check

on:
  pull_request:
    paths:
      - "src/helpers/ESP32Board.cpp"
      - "src/helpers/ESP32Board.h"
      - "platformio.ini"
      - "requirements-platformio.txt"
      - "variants/heltec_v3/**"
      - "arch/esp32/**"
      - ".github/workflows/esp32-ota-build.yaml"
  push:
    branches:
      - main
      - dev
    paths:
      - "src/helpers/ESP32Board.cpp"
      - "src/helpers/ESP32Board.h"
      - "platformio.ini"
      - "requirements-platformio.txt"
      - "variants/heltec_v3/**"
      - "arch/esp32/**"
      - ".github/workflows/esp32-ota-build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-esp32-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned PlatformIO Core
        run: python -m pip install -r requirements-platformio.txt

      - name: Build ESP32 repeater with OTA support
        run: pio run --environment Heltec_v3_repeater
